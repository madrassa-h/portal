<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4C8C3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lern-App">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest-lern.json">
<title>Lern-App — Arabisch für Kinder</title>
<link rel="apple-touch-icon" href="logo.png"/>
<link rel="icon" href="logo.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6E4;
    --paper:#FFFDF8;
    --ink:#33291C;
    --ink-soft:#6B5D48;
    --leaf:#4C8C3B;
    --leaf-dark:#356429;
    --leaf-light:#8FC46A;
    --sky:#3E9FD1;
    --sky-light:#CFEBF7;
    --sun:#F2B23E;
    --bark:#8B5E34;
    --coral:#E8604F;
    --shadow: 0 8px 24px rgba(51,41,28,.10), 0 2px 6px rgba(51,41,28,.06);
    --shadow-hover: 0 12px 32px rgba(51,41,28,.14), 0 4px 10px rgba(51,41,28,.08);
    --radius-lg: 24px;
    --radius-md: 16px;
    --space: 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 85% -10%, var(--sky-light), transparent 60%),
      var(--cream);
    color:var(--ink);
    font-family:'Nunito', 'Tajawal', sans-serif;
    min-height:100vh;min-height:100dvh;
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  h1,h2,h3,.display,.ar-text{ font-family:'Cairo', 'Tajawal', sans-serif; }
  .ar-text, .ar-word, .ar-letter, .q-ar, .answer-btn.ar, .sentence-ar,
  .word-ar, .story-ar, .trace-letter, .guide-letter,
  .match-item.ar, .order-chip{ direction:rtl; unicode-bidi:embed; line-height:1.9; }
  button{ font-family:inherit; }
  :focus-visible{ outline:3px solid var(--sky); outline-offset:3px; border-radius:10px; }
  .wrap{ max-width:780px; margin:0 auto; padding:0 calc(var(--space)*2) 70px; }

  /* ---------- Header ---------- */
  .brandbar{
    position:relative; overflow:hidden;
    background:linear-gradient(180deg, var(--sky-light) 0%, var(--cream) 88%);
    padding:28px 16px 42px;
    border-bottom:4px solid rgba(76,140,59,.18);
  }
  .sun{
    position:absolute; top:-40px; left:-30px; width:140px; height:140px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #FFE3A0, var(--sun) 70%);
    box-shadow:0 0 0 12px rgba(242,178,62,.18);
  }
  .brand-inner{ position:relative; max-width:760px; margin:0 auto; text-align:center; }
  .tree{ width:80px; height:80px; margin:0 auto 4px; position:relative; }
  .tree .canopy{ position:absolute; border-radius:50%; background:var(--leaf); box-shadow: inset -5px -6px 0 rgba(0,0,0,.08); }
  .tree .canopy.c1{ width:54px; height:54px; left:13px; top:0; background:var(--leaf-light); }
  .tree .canopy.c2{ width:48px; height:48px; left:0; top:12px; }
  .tree .canopy.c3{ width:48px; height:48px; right:0; top:12px; }
  .tree .trunk{ position:absolute; width:12px; height:22px; background:var(--bark); border-radius:4px; left:34px; top:48px; }

  .brand-logo-row{
    display:flex; align-items:center; justify-content:center; gap:12px;
    margin:0 0 10px;
  }
  .brand-logo{
    width:56px; height:56px; object-fit:contain; border-radius:50%;
    background:#fff; padding:3px;
    box-shadow:0 2px 10px rgba(51,41,28,.12);
    border:2px solid rgba(255,255,255,.9);
  }
  .brand-logo-text{ text-align:left; line-height:1.25; }
  .brand-school-ar{
    font-family:'Cairo','Amiri',serif; font-size:18px; font-weight:800;
    color:var(--leaf-dark); direction:rtl;
  }
  .brand-school-ar span{ color:var(--leaf); }
  .brand-school-de{
    font-size:12px; font-weight:600; color:var(--ink-soft); letter-spacing:.02em;
  }

  .brand-title{ margin:2px 0 2px; font-size:clamp(20px,4.8vw,28px); font-weight:800; color:var(--leaf-dark); }
  .brand-sub{ margin:0; color:var(--ink-soft); font-size:14px; font-weight:600; }
  .brand-credit{ margin-top:8px; font-size:12px; color:var(--ink-soft); opacity:.8; }
  .mode-badge{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px;
    background:var(--paper); border:1px solid rgba(51,41,28,.12); border-radius:999px;
    padding:4px 12px; font-size:12px; color:var(--ink-soft); font-weight:700;
  }
  .mode-badge.on{ color:var(--leaf-dark); }

  /* ---------- Home ---------- */
  .section{ padding-top:22px; }
  .section-title{ font-size:15px; font-weight:800; color:var(--ink-soft); margin:0 0 12px; }
  .home-toolbar{ display:flex; flex-wrap:wrap; gap:calc(var(--space)); margin-bottom:calc(var(--space)*2); align-items:stretch; }
  .home-toolbar .btn-sm{ flex:1; min-width:0; text-align:center; padding:14px 12px; font-size:15px; border-radius:14px; }
  .home-toolbar .btn-quiz{
    flex:1.4; background:var(--leaf); color:#fff; border-color:transparent;
    box-shadow:0 4px 0 var(--leaf-dark); font-size:16px; font-weight:800;
  }
  .home-toolbar .btn-quiz:active{ transform:translateY(2px); box-shadow:none; }
  .dict-search{
    width:100%; padding:12px 14px; border-radius:14px; border:2px solid rgba(51,41,28,.16);
    font-family:inherit; font-size:15px; background:var(--cream); margin:12px 0 16px;
  }
  .story-box{ background:var(--paper); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow); border-top:6px solid var(--unit-color, var(--leaf)); }
  .story-line{ margin-bottom:16px; padding-bottom:12px; border-bottom:1px dashed rgba(51,41,28,.1); }
  .story-line:last-child{ border-bottom:none; margin-bottom:0; }
  .story-ar{ font-family:'Cairo'; font-size:20px; font-weight:800; direction:rtl; line-height:1.9; }
  .story-tr{ font-size:13px; color:var(--leaf-dark); font-weight:600; margin:4px 0; }
  .story-de{ font-size:14px; color:var(--ink-soft); }
  .unit-stars{ font-size:14px; letter-spacing:1px; min-height:18px; }
  .stroke-hint{ font-size:12px; color:var(--ink-soft); text-align:center; margin-top:8px; font-weight:600; }
  @media print{
    .brandbar, .home-toolbar, .back-btn, .mode-badge, footer, .btn-speak, .trace-actions, #quizScreen, #resultScreen, #hubScreen, #learnScreen .learn-tabs{ display:none !important; }
    body{ background:#fff; }
    .word-card, .sentence-card, .story-line{ break-inside:avoid; box-shadow:none; border:1px solid #ccc; }
  }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:calc(var(--space)*1.5); margin-top:var(--space);
  }
  .unit-card{
    all:unset; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--paper); border-radius:var(--radius-md);
    padding:calc(var(--space)*2) calc(var(--space)*1.25) calc(var(--space)*1.5); text-align:center;
    box-shadow: var(--shadow);
    border:3px solid var(--card-color, var(--leaf));
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .unit-card:hover{ transform:translateY(-4px); box-shadow: var(--shadow-hover); }
  .unit-card:active{ transform:translateY(1px); box-shadow:0 2px 6px rgba(51,41,28,.10); }
  .unit-icon{
    width:48px; height:48px; border-radius:50%; display:grid; place-items:center;
    background:var(--card-color, var(--leaf)); font-size:24px;
  }
  .unit-num{ font-size:11px; font-weight:800; color:var(--card-color, var(--leaf)); letter-spacing:.4px; }
  .unit-title{ font-weight:800; font-size:14px; line-height:1.3; }
  .unit-title-ar{ font-family:'Cairo',sans-serif; font-size:13px; color:var(--ink-soft); direction:rtl; }
  .unit-count{ font-size:11.5px; color:var(--ink-soft); }

  .mixed-card{ grid-column:1 / -1; }
  .mixed-card .unit-card{
    flex-direction:row; justify-content:center; gap:12px; padding:16px;
    background:linear-gradient(90deg, #FDEFD9, #FFF); border-style:dashed;
  }

  /* ---------- Unit Hub ---------- */
  .hub-header{ display:flex; align-items:center; gap:12px; margin-top:18px; }
  .back-btn{
    all:unset; cursor:pointer; width:42px; height:42px; border-radius:50%;
    background:var(--paper); border:2px solid rgba(51,41,28,.15); display:grid; place-items:center; font-size:18px; flex:none;
  }
  .hub-info{ flex:1; }
  .hub-title{ font-weight:800; font-size:18px; margin:0; }
  .hub-title-ar{ font-family:'Cairo'; font-size:15px; color:var(--ink-soft); direction:rtl; margin:2px 0 0; }
  .hub-actions{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:28px; }
  .hub-btn{
    all:unset; cursor:pointer; background:var(--paper); border-radius:var(--radius-lg);
    padding:28px 16px; text-align:center; box-shadow:var(--shadow);
    border:3px solid var(--unit-color, var(--leaf)); transition:transform .12s;
  }
  .hub-btn:hover{ transform:translateY(-3px); }
  .hub-btn:active{ transform:translateY(2px); }
  .hub-btn .icon{ font-size:42px; margin-bottom:8px; }
  .hub-btn .label{ font-weight:800; font-size:17px; }
  .hub-btn .sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; }

  /* ---------- Learning screen ---------- */
  .learn-tabs{ display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
  .learn-tab{
    all:unset; cursor:pointer; padding:10px 16px; border-radius:999px; font-weight:800; font-size:14px;
    background:var(--paper); border:2px solid rgba(51,41,28,.12); color:var(--ink-soft);
  }
  .learn-tab.active{ background:var(--unit-color, var(--leaf)); color:#fff; border-color:transparent; }
  .learn-panel{ margin-top:20px; }
  .learn-panel.hidden{ display:none; }

  /* Letters */
  .letter-picker{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:18px; }
  .letter-chip{
    all:unset; cursor:pointer; width:52px; height:52px; border-radius:14px;
    background:var(--paper); border:2.5px solid rgba(51,41,28,.12);
    display:grid; place-items:center; font-family:'Cairo'; font-size:26px; font-weight:800;
  }
  .letter-chip.active{ border-color:var(--unit-color, var(--leaf)); background:#E8F5E3; color:var(--leaf-dark); }
  .trace-area{
    background:var(--paper); border-radius:var(--radius-lg); padding:16px;
    box-shadow:var(--shadow); border-top:6px solid var(--unit-color, var(--leaf));
  }
  .trace-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .trace-letter-block{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
  .trace-letter{ font-family:'Cairo'; font-size:48px; font-weight:900; color:var(--unit-color, var(--leaf)); line-height:1; }
  .trace-pron{ font-size:14px; font-weight:700; color:var(--ink-soft); }
  .trace-hint{ font-size:13px; color:var(--ink-soft); }
  .canvas-wrap{
    position:relative; width:100%; max-width:340px; margin:0 auto;
    aspect-ratio:1; background:#FFF; border-radius:16px; border:2px dashed rgba(51,41,28,.15);
    overflow:hidden; touch-action:none;
  }
  #traceCanvas{ width:100%; height:100%; display:block; cursor:crosshair; }
  .guide-letter{
    position:absolute; inset:0; display:grid; place-items:center;
    font-family:'Cairo'; font-size:min(180px, 55vw); font-weight:900;
    color:rgba(76,140,59,.12); pointer-events:none; user-select:none;
  }
  .trace-actions{ display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .btn-sm{
    all:unset; cursor:pointer; padding:10px 18px; border-radius:12px; font-weight:800; font-size:13.5px;
    background:var(--cream); border:2px solid rgba(51,41,28,.12);
  }
  .btn-sm.primary{ background:var(--unit-color, var(--leaf)); color:#fff; border-color:transparent; }
  .btn-speak{
    all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:50%; font-size:18px;
    background:var(--sky-light); border:2px solid rgba(62,159,209,.35);
    transition:transform .12s, background .15s;
  }
  .btn-speak:hover{ background:#B8E0F4; transform:scale(1.08); }
  .btn-speak:active{ transform:scale(.95); }
  .btn-speak.speaking{ background:var(--sky); animation:pulse-speak .8s ease infinite; }
  @keyframes pulse-speak{ 50%{ transform:scale(1.12); } }
  .word-card .btn-speak, .sentence-card .btn-speak{ margin-top:8px; }

  /* Words */
  .word-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:12px; }
  .word-card{
    background:var(--paper); border-radius:var(--radius-md); padding:16px 12px;
    text-align:center; box-shadow:var(--shadow); border:2px solid rgba(51,41,28,.08);
  }
  .word-ar{ font-family:'Cairo'; font-size:26px; font-weight:800; direction:rtl; margin-bottom:2px; line-height:1.9; }
  .word-translit{ font-size:13px; color:var(--leaf-dark); font-weight:700; margin:4px 0 2px; letter-spacing:.3px; }
  .word-de{ font-size:14px; color:var(--ink-soft); font-weight:700; }

  /* Sentences */
  .sentence-list{ display:flex; flex-direction:column; gap:12px; }
  .sentence-card{
    background:var(--paper); border-radius:var(--radius-md); padding:16px 18px;
    box-shadow:var(--shadow); border-right:5px solid var(--unit-color, var(--leaf));
  }
  .sentence-ar{ font-family:'Cairo'; font-size:18px; font-weight:700; direction:rtl; line-height:1.9; margin-bottom:4px; }
  .sentence-translit{ font-size:13px; color:var(--leaf-dark); font-weight:600; margin-bottom:6px; letter-spacing:.2px; }
  .sentence-de{ font-size:14px; color:var(--ink-soft); }

  /* ---------- Quiz ---------- */
  .quiz-top{ display:flex; align-items:center; gap:12px; margin-top:18px; }
  .progress-wrap{ flex:1; }
  .progress-label{ font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .progress-track{ height:12px; border-radius:99px; background:rgba(51,41,28,.1); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:99px; background:var(--unit-color, var(--leaf)); transition:width .35s ease; }

  .q-card{
    margin-top:22px; background:var(--paper); border-radius:var(--radius-lg);
    padding:24px 18px; box-shadow:var(--shadow); border-top:8px solid var(--unit-color, var(--leaf));
  }
  .q-eyebrow{ font-size:12.5px; font-weight:800; color:var(--unit-color, var(--leaf)); margin:0 0 6px; }
  .q-text{ font-size:clamp(17px,4vw,21px); font-weight:800; line-height:1.5; margin:0 0 6px; }
  .q-ar{ font-family:'Cairo'; font-size:clamp(18px,4.2vw,22px); font-weight:800; direction:rtl; line-height:1.9; margin:8px 0; }
  .q-hint{ font-size:13px; color:var(--ink-soft); margin-top:4px; }
  .q-flag{ display:block; width:56px; height:40px; object-fit:cover; border-radius:6px; margin:12px auto 6px; box-shadow:0 2px 8px rgba(0,0,0,.12); border:1px solid rgba(51,41,28,.12); }
  .wave-bars{ display:none; align-items:flex-end; gap:2px; height:14px; margin-left:2px; vertical-align:middle; }
  .btn-speak.speaking .wave-bars{ display:inline-flex; }
  .btn-speak.speaking{ font-size:0; }
  .btn-speak.speaking::before{ content:""; }
  .wave-bars span{ width:3px; background:currentColor; border-radius:2px; animation:waveAnim .55s ease-in-out infinite; }
  .wave-bars span:nth-child(1){ height:5px; animation-delay:0s; }
  .wave-bars span:nth-child(2){ height:11px; animation-delay:.08s; }
  .wave-bars span:nth-child(3){ height:7px; animation-delay:.16s; }
  .wave-bars span:nth-child(4){ height:13px; animation-delay:.12s; }
  .wave-bars span:nth-child(5){ height:6px; animation-delay:.04s; }
  @keyframes waveAnim{ 0%,100%{ transform:scaleY(.45); } 50%{ transform:scaleY(1); } }

  .answers{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px; }
  @media (max-width:480px){ .answers{ grid-template-columns:1fr; } }
  .answer-btn{
    all:unset; cursor:pointer; background:var(--cream); border:2.5px solid rgba(51,41,28,.14);
    border-radius:var(--radius-md); padding:14px 12px; text-align:center;
    font-weight:700; font-size:15.5px; line-height:1.4;
    transition:transform .1s ease, background .15s ease, border-color .15s ease;
  }
  .answer-btn.ar{ font-family:'Cairo'; font-size:18px; }
  .answer-btn:hover{ border-color:var(--unit-color, var(--sky)); }
  .answer-btn:active{ transform:scale(.97); }
  .answer-btn.correct{ background:#E4F4DE; border-color:var(--leaf); color:var(--leaf-dark); }
  .answer-btn.wrong{ background:#FBE3DE; border-color:var(--coral); color:#A5382A; animation:shake .32s ease; }
  .answer-btn[disabled]{ cursor:default; }
  .answer-btn.dim{ opacity:.55; }
  @media (prefers-reduced-motion: reduce){ .answer-btn.wrong{ animation:none; } }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* Order exercise */
  .order-bank, .order-slots{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; min-height:48px; direction:rtl; }
  .order-slots{ background:rgba(51,41,28,.04); border-radius:14px; padding:10px; border:2px dashed rgba(51,41,28,.12); direction:rtl; }
  .order-chip{
    all:unset; cursor:pointer; padding:10px 14px; border-radius:12px; font-family:'Cairo'; font-size:17px; font-weight:700;
    background:var(--cream); border:2px solid rgba(51,41,28,.15); direction:rtl;
  }
  .order-chip.placed{ background:#E8F5E3; border-color:var(--leaf); }
  .order-slot{
    min-width:40px; min-height:42px; border-radius:10px; border:2px dashed rgba(51,41,28,.2);
    display:inline-flex; align-items:center; justify-content:center; padding:4px 8px;
  }

  /* Match exercise — two columns opposite each other */
  .match-wrap{
    display:grid; grid-template-columns:1fr auto 1fr; gap:8px 12px; margin-top:16px; align-items:stretch;
  }
  .match-col{ display:flex; flex-direction:column; gap:10px; }
  .match-col-label{
    font-size:12px; font-weight:800; color:var(--ink-soft); text-align:center; margin-bottom:2px;
  }
  .match-vs{
    display:flex; align-items:center; justify-content:center;
    font-size:18px; color:var(--ink-soft); font-weight:800; padding-top:28px;
  }
  .match-item{
    all:unset; cursor:pointer; padding:12px 10px; border-radius:14px; text-align:center; font-weight:700;
    background:var(--cream); border:2.5px solid rgba(51,41,28,.12); font-size:15px;
    min-height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .match-item.ar{ font-family:'Cairo'; font-size:20px; direction:rtl; }
  .match-item .pron{ font-size:11px; font-weight:600; color:var(--ink-soft); font-family:'Nunito',sans-serif; direction:ltr; }
  .match-item.selected{ border-color:var(--sky); background:#E3F2FB; box-shadow:0 0 0 3px rgba(62,159,209,.25); }
  .match-item.matched{ background:#E4F4DE; border-color:var(--leaf); opacity:.75; pointer-events:none; }
  .match-item.wrong-flash{ animation:shake .3s ease; border-color:var(--coral); }
  @media (max-width:400px){
    .match-wrap{ grid-template-columns:1fr 1fr; gap:8px; }
    .match-vs{ display:none; }
  }

  .feedback{ min-height:24px; margin-top:14px; font-weight:700; font-size:14px; }
  .feedback.ok{ color:var(--leaf-dark); }
  .feedback.no{ color:#A5382A; }
  .next-btn{
    all:unset; cursor:pointer; display:block; margin:16px auto 0; padding:12px 32px;
    background:var(--unit-color, var(--leaf)); color:#fff; font-weight:800;
    border-radius:99px; font-size:15px; box-shadow:0 4px 0 rgba(0,0,0,.15); opacity:0; pointer-events:none;
    transition:opacity .15s ease;
  }
  .next-btn.show{ opacity:1; pointer-events:auto; }
  .next-btn:active{ transform:translateY(2px); box-shadow:none; }

  /* ---------- Result ---------- */
  .result-card{
    margin-top:22px; background:var(--paper); border-radius:var(--radius-lg); padding:30px 20px;
    text-align:center; box-shadow:var(--shadow);
  }
  .stars{ font-size:38px; letter-spacing:5px; margin-bottom:4px; }
  .result-score{ font-size:24px; font-weight:900; color:var(--leaf-dark); }
  .result-msg{ color:var(--ink-soft); margin-top:4px; font-size:14px; }
  .name-row{ display:flex; gap:8px; margin:20px 0 6px; }
  .name-row input{
    flex:1; padding:12px 14px; border-radius:14px; border:2px solid rgba(51,41,28,.16);
    font-family:inherit; font-size:15px; background:var(--cream);

<script type="module">
/* ======================================================================
   1) FIREBASE (optional) — leave DEIN_ for local-only mode
====================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, where, orderBy, limit, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "DEIN_API_KEY",
  authDomain: "DEIN_PROJEKT.firebaseapp.com",
  projectId: "DEIN_PROJEKT",
  storageBucket: "DEIN_PROJEKT.appspot.com",
  messagingSenderId: "DEINE_SENDER_ID",
  appId: "DEINE_APP_ID"
};

let db = null;
const firebaseConfigured = !!firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("DEIN_");
if (firebaseConfigured) {
  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
  } catch (e) {
    console.warn("Firebase fehlgeschlagen — lokaler Modus.", e);
    db = null;
  }
}

/* ======================================================================
   2) CONTENT — 10 Einheiten mit Lernen + Übungen
====================================================================== */
/* Aussprache-Hilfe für arabische Buchstaben (deutsch-freundlich) */
const LETTER_PRON = {
  "ا":"alif — a","أ":"alif hamza — a","إ":"alif hamza — i","آ":"alif madda — ā",
  "ب":"bāʾ — b","ت":"tāʾ — t","ث":"thāʾ — th","ج":"jīm — dsch",
  "ح":"ḥāʾ — h (tief)","خ":"khāʾ — ch","د":"dāl — d","ذ":"dhāl — dh",
  "ر":"rāʾ — r","ز":"zāy — s","س":"sīn — s","ش":"shīn — sch",
  "ص":"ṣād — s (emph.)","ض":"ḍād — d (emph.)","ط":"ṭāʾ — t (emph.)","ظ":"ẓāʾ — dh (emph.)",
  "ع":"ʿayn — ʿ","غ":"ghayn — gh","ف":"fāʾ — f","ق":"qāf — q",
  "ك":"kāf — k","ل":"lām — l","م":"mīm — m","ن":"nūn — n",
  "ه":"hāʾ — h","و":"wāw — w / ū","ي":"yāʾ — y / ī","ة":"tāʾ marbūṭa — a/at",
  "ى":"alif maqṣūra — ā","ء":"hamza — ʾ"
};

/* Aussprache: bevorzugt echte arabische Systemstimme (ar-SA/ar-EG), sonst Fallback */
function ensureWave(btn){
  if (!btn || btn.querySelector(".wave-bars")) return;
  const wave = document.createElement("span");
  wave.className = "wave-bars";
  wave.setAttribute("aria-hidden", "true");
  wave.innerHTML = "<span></span><span></span><span></span><span></span><span></span>";
  btn.appendChild(wave);
}
/* Arabische Buchstabennamen – klarere TTS-Aussprache als Einzelzeichen */
const LETTER_TTS_NAME = {
  "ا":"أَلِف","أ":"أَلِف","إ":"أَلِف","آ":"أَلِف",
  "ب":"باء","ت":"تاء","ث":"ثاء","ج":"جيم",
  "ح":"حاء","خ":"خاء","د":"دال","ذ":"ذال",
  "ر":"راء","ز":"زاي","س":"سين","ش":"شين",
  "ص":"صاد","ض":"ضاد","ط":"طاء","ظ":"ظاء",
  "ع":"عَيْن","غ":"غَيْن","ف":"فاء","ق":"قاف",
  "ك":"كاف","ل":"لام","م":"ميم","ن":"نون",
  "ه":"هاء","و":"واو","ي":"ياء","ة":"تاء مَرْبوطَة",
  "ى":"أَلِف مَقْصورَة","ء":"هَمْزَة"
};

function pickArabicVoice(){
  if (!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  if (!voices.length) return null;
  const score = (v) => {
    const lang = (v.lang || "").toLowerCase();
    const name = (v.name || "").toLowerCase();
    let s = 0;
    if (lang.startsWith("ar")) s += 50;
    if (/ar[-_](sa|eg|ae|kw|qa|bh|om|jo|lb|sy|iq|ma|dz|tn|ye|ly)/i.test(lang)) s += 20;
    if (/ar[-_]sa/i.test(lang)) s += 15; /* oft klarste Fuṣḥā */
    if (/google/.test(name) && /arab/.test(name)) s += 25;
    if (/microsoft/.test(name) && /arab/.test(name)) s += 18;
    if (/naayf|hoda|salma|sami|maged|zariyah|fahed/.test(name)) s += 12;
    if (/arab/.test(name)) s += 8;
    return s;
  };
  return voices.slice().sort((a,b) => score(b) - score(a))[0] || null;
}

let _speakHintTimer = null;
function showSpeakHint(msg){
  let el = document.getElementById("speakHint");
  if (!el){
    el = document.createElement("div");
    el.id = "speakHint";
    el.setAttribute("role","status");
    el.style.cssText = "position:fixed;left:12px;right:12px;bottom:16px;z-index:99999;background:#333;color:#fff;padding:12px 14px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none;";
    el.addEventListener("click", () => { el.style.display = "none"; });
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(_speakHintTimer);
  _speakHintTimer = setTimeout(() => { el.style.display = "none"; }, 9000);
}
const NO_AR_VOICE_MSG = "Keine arabische Stimme auf diesem Handy gefunden. Samsung: Einstellungen → Allgemeine Verwaltung → Sprache → Text-in-Sprache → Google Sprachausgabe → ⚙️ → Sprachdaten installieren → Arabisch. Außerdem Medien-Lautstärke prüfen.";

function speakArabic(text, btn){
  if (!window.speechSynthesis) {
    if (btn) {
      const fb = btn.parentElement?.querySelector(".feedback") || document.getElementById("feedback");
      if (fb) { fb.textContent = "Dieses Gerät hat keine Sprachausgabe."; fb.className = "feedback no"; }
    }
    return;
  }
  let raw = String(text || "").trim();
  if (!raw) return;

  /* Einzelbuchstabe → arabischer Buchstabenname für bessere Aussprache */
  if (raw.length === 1 && LETTER_TTS_NAME[raw]) {
    raw = LETTER_TTS_NAME[raw];
  }

  window.speechSynthesis.cancel();
  document.querySelectorAll(".btn-speak.speaking").forEach(b => b.classList.remove("speaking"));

  const doSpeak = () => {
    const u = new SpeechSynthesisUtterance(raw);
    u.lang = "ar-SA";
    u.rate = 0.82;   /* etwas langsamer – klarer für Kinder */
    u.pitch = 1;
    u.volume = 1;
    const arVoice = pickArabicVoice();
    if (arVoice && /^ar/i.test(arVoice.lang || "")) {
      u.voice = arVoice;
      u.lang = arVoice.lang || "ar-SA";
    } else {
      /* keine arabische Stimme installiert → Hinweis, trotzdem Versuch mit lang=ar-SA */
      void 0;
    }
    if (btn){
      ensureWave(btn);
      btn.classList.add("speaking");
      u.onend = () => btn.classList.remove("speaking");
      u.onerror = (ev) => {
        btn.classList.remove("speaking");
        if (!ev || (ev.error !== "canceled" && ev.error !== "interrupted")) void 0;
      };
    } else {
      u.onerror = (ev) => {
        if (!ev || (ev.error !== "canceled" && ev.error !== "interrupted")) void 0;
      };
    }
    try { window.speechSynthesis.resume(); } catch(e) {}
    window.speechSynthesis.speak(u);
  };

  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) {
    /* Stimmen oft erst nach voiceschanged verfügbar */
    let done = false;
    const once = () => {
      if (done) return;
      done = true;
      window.speechSynthesis.onvoiceschanged = null;
      setTimeout(doSpeak, 80);
    };
    window.speechSynthesis.onvoiceschanged = once;
    window.speechSynthesis.getVoices();
    setTimeout(once, 400);
  } else {
    setTimeout(doSpeak, 80);
  }
}
if (window.speechSynthesis){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

   Zusatz-Übungen: „Bilde ein Wort“ (Niveau 1), „Bilde einen Satz“ (beide), Großer Quiz
====================================================================== */
function wordOrderQ(w){
  if (!w.ar || /\s/.test(w.ar.trim())) return null;
  const letters = Array.from(stripHarakat(w.ar));
  if (letters.length < 3 || letters.length > 7) return null;
  return { type:"order", prompt:"Bilde das Wort:", words:letters, correct:letters, de:w.de, arHint:w.ar, speak:w.ar, shown:w.ar,
           bankLabel:"Buchstaben antippen, um das Wort zu bilden:", slotLabel:"Dein Wort (von rechts nach links lesen):" };
}
function sentenceOrderQ(s){
  const words = String(s.ar||"").replace(/[.؟!،]/g,"").trim().split(/\s+/).filter(Boolean);
  if (words.length < 2 || words.length > 7) return null;
  return { type:"order", prompt:"Bilde einen Satz:", words, correct:words, de:s.de, speak:s.ar, shown:words.join(" ") };
}
(function augmentUnits(){
  UNITS_N1.forEach(u => {
    (u.words||[]).forEach(w => { const q = wordOrderQ(w); if (q) u.questions.push(q); });
    (u.sentences||[]).forEach(x => { const q = sentenceOrderQ(x); if (q) u.questions.push(q); });
  });
  UNITS_N2.forEach(u => {
    const seen = new Set(u.questions.filter(q => q.type==="order").map(q => q.correct.join("|")));
    let added = 0;
    (u.sentences||[]).concat(u.story||[]).forEach(x => {
      const q = sentenceOrderQ(x);
      if (!q || added >= 3 || seen.has(q.correct.join("|"))) return;
      seen.add(q.correct.join("|")); u.questions.push(q); added++;
    });
  });
})();

function buildBigQuiz(){
  const N = currentNiveau;
  const pick = (a, n) => shuffle(a).slice(0, n);
  const base = [], sent = [], wrd = [];
  activeUnits.forEach(u => {
    const tag = q => ({...q, unitColor:u.color, unitTitle:u.titleDe});
    (u.questions||[]).filter(q => q.type !== "order").forEach(q => base.push(tag(q)));
    (u.sentences||[]).concat(N===2 ? (u.story||[]) : []).forEach(x => { const q = sentenceOrderQ(x); if (q) sent.push(tag(q)); });
    if (N===1) (u.words||[]).forEach(w => { const q = wordOrderQ(w); if (q) wrd.push(tag(q)); });
  });
  const tagE = (q, t) => ({...q, unitColor:t.color, unitTitle:t.titleDe});
  const nt = EXTRA_TOPICS.numbers, ct = EXTRA_TOPICS.countries;
  const nums = nt.words.filter(w => !w.lvl || w.lvl <= N);
  const distract = (pool, w, key) => pick(pool.filter(x => x !== w), 3).map(x => x[key]);
  const numQs = nums.map(w => tagE({ type:"mc", q:`Welche Zahl ist ${w.ar}?`, options:[w.n, ...distract(nums, w, "n")], correct:w.n }, nt));
  const ctrQs = ct.words.map(w => tagE({ type:"mc", q:"Wie heißt dieses Land auf Arabisch?", flag:w.flag, options:[w.ar, ...distract(ct.words, w, "ar")], correct:w.ar }, ct));
  const mix = N===2
    ? [...pick(sent,8), ...pick(numQs,4), ...pick(ctrQs,3)]
    : [...pick(wrd,5), ...pick(sent,4), ...pick(numQs,3), ...pick(ctrQs,3)];
  const rest = 25 - mix.length;
  return shuffle([...mix, ...pick(base, rest)]);
}

/* Canvas drawing */
/* Scroll vs. Zeichnen: vertikale Wische = Seite scrollen, sonst zeichnen */
let drawIntent = null; /* null | pending | draw | scroll */
let drawStart = null;
let drawPointerId = null;

function initCanvas(){
  canvas = document.getElementById("traceCanvas");
  if (!canvas) return;
  const wrap = canvas.parentElement;
  const size = Math.min(wrap.clientWidth, 340);
  canvas.width = size * 2;
  canvas.height = size * 2;
  ctx = canvas.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(2,2);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = 5;
  ctx.strokeStyle = "#356429";

  canvas.style.touchAction = "none";
  canvas.onpointerdown = startDraw;
  canvas.onpointermove = draw;
  canvas.onpointerup = endDraw;
  canvas.onpointerleave = endDraw;
  canvas.onpointercancel = endDraw;
}

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left),
    y: (e.clientY - rect.top)
  };
}

function startDraw(e){
  if (!ctx) return;
  drawIntent = "pending";
  drawing = false;
  drawStart = getPos(e);
  drawPointerId = e.pointerId;
  /* kein preventDefault → Browser darf noch scrollen, bis wir Zeichnen bestätigen */
}

function draw(e){
  if (!drawIntent || drawIntent === "scroll") return;
  const p = getPos(e);
  if (drawIntent === "pending"){
    const dx = Math.abs(p.x - drawStart.x);
    const dy = Math.abs(p.y - drawStart.y);
    if (dx + dy < 10) return;
    /* Überwiegend vertikal → Scrollen erlauben, nicht zeichnen */
    if (dy > dx * 1.25 && dy > 14){
      drawIntent = "scroll";
      drawing = false;
      return;
    }
    drawIntent = "draw";
    drawing = true;
    try { canvas.setPointerCapture(drawPointerId); } catch(_){}
    ctx.beginPath();
    ctx.moveTo(drawStart.x, drawStart.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    e.preventDefault();
    return;
  }
  if (!drawing) return;
  e.preventDefault();
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
}

function endDraw(e){
  drawing = false;
  drawIntent = null;
  drawStart = null;
  drawPointerId = null;
}

function clearCanvas(){
  if (!ctx || !canvas) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* Alphabet-Übungen: Buchstabe erkennen + anhören (Stimme) */
function buildAlphabetQuestions(){
  const letters = FULL_ALPHABET.slice();
  const qs = [];
  const pool = shuffle(letters.slice());
  /* Typ A: Welcher Buchstabe ist das? (mit Aussprache-Hinweis) */
  pool.slice(0, 10).forEach(L => {
    const wrong = shuffle(letters.filter(x => x !== L)).slice(0, 3);
    const opts = shuffle([L, ...wrong]);
    const pron = (LETTER_PRON[L] || L).split("—")[0].trim();
    qs.push({
      type: "mc",
      q: `Welcher Buchstabe ist „${pron}“?`,
      options: opts,
      correct: L,
      speak: L,
      hint: "Tipp: 🔊 anhören"
    });
  });
  /* Typ B: Hör zu und wähle */
  shuffle(letters.slice()).slice(0, 8).forEach(L => {
    const wrong = shuffle(letters.filter(x => x !== L)).slice(0, 3);
    const opts = shuffle([L, ...wrong]);
    qs.push({
      type: "listen",
      q: "Hör zu und wähle den richtigen Buchstaben",
      options: opts,
      correct: L,
      speak: L
    });
  });
  return shuffle(qs).slice(0, 12);
}

    questions = buildBigQuiz();
  } else if (unit.id === "alphabet"){
    const qs = (unit.questions && unit.questions.length) ? unit.questions : buildAlphabetQuestions();
    questions = qs.map(q => ({...q, unitColor:unit.color, unitTitle:unit.titleDe}));
  } else {
    questions = (unit.questions || []).map(q => ({...q, unitColor:unit.color, unitTitle:unit.titleDe}));
  }
  if (!questions.length){
    alert("Für diese Einheit gibt es noch keine Übungsfragen.");
    return;
  }
  state = { unit, order: questions, idx:0, score:0, locked:false };
  document.documentElement.style.setProperty("--unit-color", unit.color);
  show("quizScreen");
  renderQuestion();
}


/* Lexikon für dezente Übersetzungen neben arabischen Wörtern */
function buildLexicon(){
  const map = {};
  const add = (w) => {
    if (!w || !w.ar) return;
    map[w.ar] = w;
    const bare = String(w.ar).replace(/[\u064B-\u0652\u0670]/g, "");
    if (bare && !map[bare]) map[bare] = w;
  };
  (typeof UNITS_N1 !== "undefined" ? UNITS_N1 : []).forEach(u => (u.words||[]).forEach(add));
  (typeof UNITS_N2 !== "undefined" ? UNITS_N2 : UNITS).forEach(u => (u.words||[]).forEach(add));
  (activeUnits||[]).forEach(u => (u.words||[]).forEach(add));
  if (typeof EXTRA_TOPICS !== "undefined"){
    Object.values(EXTRA_TOPICS).forEach(t => (t.words||[]).forEach(add));
  }
  return map;
}
function stripHarakat(s){
  return String(s||"").replace(/[ً-ْٰـ]/g, "").trim();
}
function lookupWord(ar){
  if (!ar) return null;
  const lex = buildLexicon();
  if (lex[ar]) return lex[ar];
  const bare = stripHarakat(ar);
  if (lex[bare]) return lex[bare];
  for (const k of Object.keys(lex)){
    if (stripHarakat(k) === bare) return lex[k];
  }
  return null;
}
const AR_TOKEN_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF٠-٩0-9...\.\,\!\?\:\;\"\'\-\s]+/g;
function extractArabicChunks(text){
  const s = String(text||"");
  const chunks = [];
  const re = /[\u0600-\u06FF][\u0600-\u06FF\u064B-\u0652\u0670\u0640]*([^\S\r\n]*[\u0600-\u06FF][\u0600-\u06FF\u064B-\u0652\u0670\u0640]*)*/g;
  let m;
  while ((m = re.exec(s))){
    const t = m[0].trim();
    if (t.length) chunks.push({ ar:t, index:m.index, len:m[0].length });
  }
  return chunks;
}
function isMostlyArabic(str){
  const s = String(str||"");
  const ar = (s.match(/[\u0600-\u06FF]/g)||[]).length;
  const lat = (s.match(/[A-Za-zÄÖÜäöüß]/g)||[]).length;
  return ar > 0 && ar >= lat;
}
function renderQTextWithArabic(q){
  const qEl = document.getElementById("qText");
  const extra = document.getElementById("qExtra");
  const raw = String(q.q || "");

  /* --- Missing letter: saubere Darstellung mit ... und ganzes Wort sprechen --- */
  if (q.type === "missing"){
    qEl.textContent = "Welcher Buchstabe fehlt?";
    const full = q.full || "";
    const w = lookupWord(full) || { ar: full, de: q.hint || "", tr: "" };
    /* Anzeige: fehlenden Buchstaben als ... im Wort andeuten, wenn möglich */
    let display = full;
    if (q.correct && full.includes(q.correct)){
      /* ersten Treffer des korrekten Buchstabens durch ... ersetzen */
      display = full.replace(q.correct, "...");
    } else if (/\.\.\./.test(raw)){
      const m = raw.match(/([\u0600-\u06FF\.\.]+)/);
      if (m) display = m[1].replace(/…/g, "...");
    }
    appendWordRow(extra, display, w, full); /* speak = volles Wort */
    return;
  }

  if (q.type === "fill" || q.rtl){
    let deOnly = raw.replace(/[\u0600-\u06FF\u064B-\u0652\u0670\u0640\.…]+/g, " ").replace(/\s{2,}/g, " ").trim();
    deOnly = deOnly.replace(/[:：]\s*$/, "") || "Ergänze";
    qEl.textContent = deOnly;
    const full = q.full || q.correct || "";
    const w = lookupWord(full) || lookupWord(q.correct) || { ar: full || q.correct, de: q.hint || "", tr: "" };
    const show = full ? full.replace(q.correct || "", "...") : (q.correct || "...");
    appendWordRow(extra, show.indexOf("...") >= 0 ? show : ("... " + (full || "")), w, full || q.correct);
    return;
  }

  const chunks = extractArabicChunks(raw);
  let deOnly = raw;
  chunks.forEach(c => { deOnly = deOnly.replace(c.ar, " "); });
  deOnly = deOnly.replace(/\s{2,}/g, " ").replace(/\s+([?!.])/g, "$1").trim();
  if (!deOnly) deOnly = raw;

  qEl.classList.remove("fill-rtl");
  if (!chunks.length){
    qEl.textContent = raw;
    return;
  }
  qEl.textContent = deOnly;
  chunks.forEach(c => {
    const w = lookupWord(c.ar) || { ar: c.ar, de: q.hint || "", tr: "" };
    appendWordRow(extra, c.ar, w, q.speak || c.ar);
  });
}

function appendWordRow(container, arText, w, speakText){
  const row = document.createElement("div");
  row.className = "q-word-row";
  /* Sprecher links unten neben dem Wort */
  const sb = document.createElement("button");
  sb.type = "button";
  sb.className = "btn-speak";
  sb.title = "Anhören";
  sb.innerHTML = '<span class="wave-icon">🔊</span>';
  ensureWave(sb);
  const toSpeak = speakText || (w && w.ar) || arText;
  sb.addEventListener("click", (e) => {
    e.stopPropagation();
    speakArabic(toSpeak, sb);
  });
  const ar = document.createElement("div");
  ar.className = "q-word-ar";
  ar.textContent = arText;
  const meta = document.createElement("div");
  meta.className = "q-word-meta";
  const de = (w && w.de) ? w.de : "";
  const tr = (w && w.tr) ? w.tr : "";
  if (de){
    const d = document.createElement("div");
    d.className = "q-word-de";
    d.textContent = de;
    meta.appendChild(d);
  }
  if (tr){
    const t = document.createElement("div");
    t.className = "q-word-tr";
    t.textContent = tr;
    meta.appendChild(t);
  }
  row.appendChild(sb);
  row.appendChild(ar);
  if (de || tr) row.appendChild(meta);
  container.appendChild(row);
}

function styleAnswerButton(btn, opt){
  if (isMostlyArabic(opt)){
    btn.classList.add("ar");
    const w = lookupWord(opt);
    if (w && w.de){
      btn.innerHTML = `<span class="ans-ar">${opt}</span><span class="ans-de">${w.de}</span>`;
    } else {
      btn.textContent = opt;
    }
  } else {
    btn.classList.remove("ar");
    btn.textContent = opt;
  }
}


function renderQuestion(){
  const total = state.order.length;
  const q = state.order[state.idx];
  document.getElementById("progressLabel").textContent = `Frage ${state.idx+1} von ${total}`;
  document.getElementById("progressFill").style.width = `${(state.idx/total)*100}%`;
  document.getElementById("progressFill").style.background = q.unitColor || state.unit.color;
  document.getElementById("qEyebrow").textContent = q.unitTitle || state.unit.titleDe;
  document.getElementById("qCard").style.setProperty("--unit-color", q.unitColor || state.unit.color);

  const wrap = document.getElementById("answersWrap");
  const extra = document.getElementById("qExtra");
  wrap.innerHTML = "";
  extra.innerHTML = "";
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("nextBtn").classList.remove("show");
  document.getElementById("qText").classList.remove("fill-rtl");
  state.locked = false;

  if (q.type === "mc" || q.type === "fill" || q.type === "missing" || q.type === "listen"){
    if (q.flag) {
      extra.innerHTML = `<img class="q-flag" src="https://flagcdn.com/w80/${q.flag}.png" width="56" height="40" alt="Flagge" loading="lazy">`;
    }
    renderQTextWithArabic(q);
    /* Listen-Quiz: extra Speak falls noch nicht durch arabisches Wort abgedeckt */
    if (q.type === "listen" && q.speak) {
      const speakWrap = document.createElement("div");
      speakWrap.style.cssText = "display:flex;justify-content:center;margin:10px 0 4px;";
      const sb = document.createElement("button");
      sb.className = "btn-speak";
      sb.title = "Anhören";
      sb.innerHTML = '<span class="wave-icon">🔊</span>';
      ensureWave(sb);
      sb.addEventListener("click", (e) => {
        e.stopPropagation();
        speakArabic(q.speak, sb);
      });
      speakWrap.appendChild(sb);
      extra.appendChild(speakWrap);
      setTimeout(() => speakArabic(q.speak, sb), 280);
    }
    if (q.hint && !extractArabicChunks(q.q||"").length) {
      const hp = document.createElement("p");
      hp.className = "q-hint";
      hp.textContent = q.hint;
      extra.appendChild(hp);
    }
    if (q.full && q.type === "missing") {
      const hp = document.createElement("p");
      hp.className = "q-hint";
      hp.textContent = "Vollständig: " + q.full;
      extra.appendChild(hp);
    }
    const opts = shuffle(q.options);
    opts.forEach(opt => {
      const b = document.createElement("button");
      b.className = "answer-btn";
      styleAnswerButton(b, opt);
      b.addEventListener("click", () => selectMC(b, opt, q.correct));
      wrap.appendChild(b);
    });
  } else if (q.type === "match"){
    document.getElementById("qText").textContent = "Verbinde Arabisch ↔ Deutsch";
    renderMatch(q);
  } else if (q.type === "order"){
    document.getElementById("qText").textContent = q.prompt || "Ordne die Wörter zum Satz";
    if (q.de) extra.innerHTML = `<p class="q-hint">${q.de}${q.arHint ? ` &nbsp;·&nbsp; <span dir="rtl" style="font-family:'Cairo','Tajawal',sans-serif;font-size:1.5em;font-weight:700;color:var(--ink);vertical-align:middle;">${q.arHint}</span>` : ""}</p>`;
    if (q.speak){
      const sw = document.createElement("div");
      sw.style.cssText = "display:flex;justify-content:center;margin:8px 0;";
      const sb = document.createElement("button");
      sb.className = "btn-speak"; sb.title = "Anhören";
      sb.innerHTML = '<span class="wave-icon">🔊</span>';
      ensureWave(sb);
      sb.addEventListener("click", (e) => { e.stopPropagation(); speakArabic(q.speak, sb); });
      sw.appendChild(sb); extra.appendChild(sw);
    }
    renderOrder(q);
  }
}

function answerValue(btn){
  const ar = btn.querySelector(".ans-ar");
  return ar ? ar.textContent.trim() : (btn.dataset.value || btn.textContent.trim());
}
function selectMC(btn, chosen, correct){
  if (state.locked) return;
  state.locked = true;
  const buttons = [...document.querySelectorAll(".answer-btn")];
  buttons.forEach(b => {
    b.disabled = true;
    if (answerValue(b) === correct) b.classList.add("correct");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("feedback");
  if (chosen === correct){
    state.score++;
    fb.textContent = "Richtig! Super ✅";
    fb.className = "feedback ok";
  } else {
    btn.classList.remove("dim"); btn.classList.add("wrong");
    const w = lookupWord(correct);
    const corrLabel = w && w.de ? `${correct} (${w.de})` : correct;
    fb.textContent = `Leider falsch — richtig ist: ${corrLabel}`;
    fb.className = "feedback no";
  }
  showNextBtn();
}

/* Match pairs — Arabisch links, Deutsch rechts (gegenüber) */
function renderMatch(q){
  const wrap = document.getElementById("answersWrap");
  wrap.className = "";
  wrap.innerHTML = "";

  const pairs = shuffle(q.pairs.map(p => [...p]));
  const left = shuffle(pairs.map(p => p[0]));
  const right = shuffle(pairs.map(p => p[1]));
  const map = Object.fromEntries(pairs);

  /* Aussprache aus aktuellem Unit-Wörterbuch holen */
  const pronMap = {};
  if (state.unit && state.unit.words){
    state.unit.words.forEach(w => { pronMap[w.ar] = w.tr; });
  }

  const outer = document.createElement("div");
  outer.className = "match-wrap";

  const colAr = document.createElement("div");
  colAr.className = "match-col";
  colAr.innerHTML = `<div class="match-col-label">العربية</div>`;

  const colVs = document.createElement("div");
  colVs.className = "match-vs";
  colVs.textContent = "↔";

  const colDe = document.createElement("div");
  colDe.className = "match-col";
  colDe.innerHTML = `<div class="match-col-label">Deutsch</div>`;

  left.forEach(ar => {
    const b = document.createElement("button");
    b.className = "match-item ar";
    b.dataset.side = "ar";
    b.dataset.val = ar;
    const pron = pronMap[ar] ? `<span class="pron">${pronMap[ar]}</span>` : "";
    b.innerHTML = `<span>${ar}</span>${pron}`;
    colAr.appendChild(b);
  });
  right.forEach(de => {
    const b = document.createElement("button");
    b.className = "match-item";
    b.dataset.side = "de";
    b.dataset.val = de;
    b.textContent = de;
    colDe.appendChild(b);
  });

  outer.appendChild(colAr);
  outer.appendChild(colVs);
  outer.appendChild(colDe);
  wrap.appendChild(outer);

  let selected = null;
  let matched = 0;
  const total = pairs.length;

  outer.querySelectorAll(".match-item").forEach(btn => {
    btn.addEventListener("click", () => {
      if (state.locked || btn.classList.contains("matched")) return;
      if (!selected){
        selected = btn;
        btn.classList.add("selected");
        return;
      }
      if (selected === btn){
        selected.classList.remove("selected");
        selected = null;
        return;
      }
      if (selected.dataset.side === btn.dataset.side){
        selected.classList.remove("selected");
        selected = btn;
        btn.classList.add("selected");
        return;
      }
      const arBtn = selected.dataset.side === "ar" ? selected : btn;
      const deBtn = selected.dataset.side === "de" ? selected : btn;
      if (map[arBtn.dataset.val] === deBtn.dataset.val){
        arBtn.classList.add("matched");
        deBtn.classList.add("matched");
        arBtn.classList.remove("selected");
        deBtn.classList.remove("selected");
        matched++;
        selected = null;
        if (matched >= total){
          state.score++;
          state.locked = true;
          document.getElementById("feedback").textContent = "Alle richtig verbunden! ✅";
          document.getElementById("feedback").className = "feedback ok";
          showNextBtn();
        }
      } else {
        arBtn.classList.add("wrong-flash");
        deBtn.classList.add("wrong-flash");
        setTimeout(() => {
          arBtn.classList.remove("wrong-flash","selected");
          deBtn.classList.remove("wrong-flash","selected");
        }, 400);
        selected = null;
      }
    });
  });
}

/* Order words */
function renderOrder(q){
  const wrap = document.getElementById("answersWrap");
  wrap.className = "answers";
  wrap.style.gridTemplateColumns = "1fr";

  const bank = document.createElement("div");
  bank.className = "order-bank";
  bank.id = "orderBank";
  const slots = document.createElement("div");
  slots.className = "order-slots";
  slots.id = "orderSlots";

  let shuffled = shuffle(q.words);
  for (let t = 0; t < 5 && q.words.length > 1 && shuffled.join("|") === q.correct.join("|"); t++) shuffled = shuffle(q.words);
  const placed = [];

  shuffled.forEach(w => {
    const chip = document.createElement("button");
    chip.className = "order-chip";
    chip.textContent = w;
    chip.dataset.word = w;
    chip.addEventListener("click", () => {
      if (state.locked) return;
      if (chip.classList.contains("placed")){
        chip.classList.remove("placed");
        chip.style.display = "";
        const idx = placed.indexOf(w);
        if (idx >= 0) placed.splice(idx,1);
        renderSlots();
        return;
      }
      placed.push(w);
      chip.classList.add("placed");
      chip.style.display = "none";
      renderSlots();
      if (placed.length === q.words.length){
        checkOrder();
      }
    });
    bank.appendChild(chip);
  });

  function renderSlots(){
    slots.innerHTML = "";
    placed.forEach((w,i) => {
      const s = document.createElement("span");
      s.className = "order-chip placed";
      s.textContent = w;
      s.addEventListener("click", () => {
        if (state.locked) return;
        placed.splice(i,1);
        const bankChip = [...bank.querySelectorAll(".order-chip")].find(c => c.dataset.word === w && c.classList.contains("placed"));
        if (bankChip){ bankChip.classList.remove("placed"); bankChip.style.display = ""; }
        renderSlots();
      });
      slots.appendChild(s);
    });
    for (let i = placed.length; i < q.words.length; i++){
      const empty = document.createElement("span");
      empty.className = "order-slot";
      empty.textContent = "·";
      slots.appendChild(empty);
    }
  }

  function checkOrder(){
    state.locked = true;
    const ok = placed.every((w,i) => w === q.correct[i]);
    const fb = document.getElementById("feedback");
    if (ok){
      state.score++;
      fb.textContent = "Richtige Reihenfolge! ✅";
      fb.className = "feedback ok";
    } else {
      fb.textContent = `Leider nicht — richtig: ${q.shown || q.correct.join(" ")}`;
      fb.className = "feedback no";
    }
    showNextBtn();
  }

  wrap.appendChild(document.createTextNode((q.bankLabel || "Wörter antippen, um sie in die Reihe zu setzen:")));
  wrap.appendChild(bank);
  wrap.appendChild(document.createElement("br"));
  const label = document.createElement("div");
  label.style.cssText = "font-size:13px;color:var(--ink-soft);margin:8px 0 4px;font-weight:700;";
  label.textContent = q.slotLabel || "Dein Satz (von rechts nach links lesen):";
  wrap.appendChild(label);
  wrap.appendChild(slots);
  renderSlots();
}

function showNextBtn(){
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.textContent = (state.idx === state.order.length-1) ? "Ergebnis anzeigen 🏁" : "Nächste Frage →";
  nextBtn.classList.add("show");
}

});

/* ---------- Result + Leaderboard ---------- */
function showResult(){
  show("resultScreen");
  const total = state.order.length;
  const pct = total ? state.score / total : 0;
  const stars = pct >= .9 ? "⭐⭐⭐" : pct >= .6 ? "⭐⭐" : pct >= .3 ? "⭐" : "☁️";
  document.getElementById("starsEl").textContent = stars;
  document.getElementById("scoreEl").textContent = `${state.score} / ${total}`;
  document.getElementById("resultMsg").textContent = "Guter Anfang — übe noch ein bisschen 💪";

  /* Fortschritt speichern: 1–3 Sterne */
  const earned = pct >= .9 ? 3 : pct >= .6 ? 2 : pct >= .3 ? 1 : 0;
  if (earned) setUnitStars(state.unit.id, earned);

  if (pct >= .8 && !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    launchConfetti(state.unit.color);
  }
}

async function loadLeaderboard(unitId){
  const list = document.getElementById("boardList");
  list.innerHTML = `<li class="empty">Lade ...</li>`;
  let rows = [];

  if (db){
    try {
      const q = query(
        collection(db, "quizErgebnisse"),
        where("unitId", "==", unitId),
        orderBy("score", "desc"),
        limit(10)
      );
      const snap = await getDocs(q);
      snap.forEach(d => rows.push(d.data()));
    } catch(e){
      console.warn("Rangliste konnte nicht geladen werden.", e);
    }
  }
  if (!db || rows.length === 0){
    const all = JSON.parse(localStorage.getItem("quizLocalScores") || "[]");
    rows = all.filter(r => r.unitId === unitId).sort((a,b) => b.score - a.score).slice(0,10);
  }

  if (rows.length === 0){
    list.innerHTML = `<li class="empty">Noch keine Ergebnisse — sei der Erste!</li>`;
    return;
  }
  list.innerHTML = "";
  rows.forEach((r, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span><span class="rank">${i+1}.</span>${escapeHtml(r.name)}</span><span>${r.score} / ${r.total}</span>`;
    list.appendChild(li);
  });
}

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

    } else if (document.referrer) {
      location.href = document.referrer;
    } else {
      history.back();
    }
  });
})();

show("niveauScreen");

/* Service Worker für Offline-Nutzung */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(err => console.warn("SW registrierung fehlgeschlagen:", err));
}
</script>
<script>
window.PORTAL_BACK={
  close:function(){return false;},
  back:function(){
    var map=[['quizScreen','backBtn'],['resultScreen','homeBtn'],['learnScreen','learnBackBtn'],['hubScreen','hubBackBtn'],['dictScreen','dictBackBtn'],['topicScreen','topicBackBtn'],['homeScreen','homeBackNiveau']];
    for(var i=0;i<map.length;i++){
      var s=document.getElementById(map[i][0]);
      if(s&&!s.classList.contains('hidden')){
        var b=document.getElementById(map[i][1]);
        if(b){b.click();return true;}
      }
    }
    return false; /* Niveau-Auswahl = Startseite (im Admin-Portal übernimmt das Portal) */
  }
};
/* ══ ANDROID-ZURÜCK-TASTE (nur installierte App / Standalone) ══
   Verhalten: Zurück-Taste = Zurück-Pfeil der App (Dialog schließen → Unterseite → Startseite).
   Erst auf der Startseite: 1. Druck zeigt Hinweis, 2. Druck innerhalb von 2,5 s beendet die App.
   Im normalen Browser-Tab (Chrome/Edge) und bei der Installation passiert NICHTS – der Block bleibt inaktiv. */
(function(){
  var cfg=window.PORTAL_BACK||{};
  window.__portalBack=function(){
    try{ if(cfg.close&&cfg.close())return true; }catch(e){}
    try{ if(cfg.back&&cfg.back())return true; }catch(e){}
    return false;
  };
  if(window.__bkGuardInit)return; window.__bkGuardInit=true;
  if(window.parent!==window)return; /* im iframe: nur __portalBack bereitstellen */
  var standalone=false;
  try{
    standalone=(window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: minimal-ui)').matches))||window.navigator.standalone===true;
  }catch(e){}
  if(!standalone||!window.history||!history.pushState)return;

  var exitTimer=null, toastEl=null, toastTimer=null;
  function mark(){return history.state&&history.state.__bk;}
  function toast(msg){
    try{
      if(!toastEl){
        toastEl=document.createElement('div');
        toastEl.setAttribute('role','status');
        toastEl.style.cssText='position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88vw;background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:22px;font:600 .85rem/1.3 system-ui,sans-serif;z-index:2147483647;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;';
        document.body.appendChild(toastEl);
      }
      toastEl.textContent=msg; toastEl.style.opacity='1';
      clearTimeout(toastTimer);
      toastTimer=setTimeout(function(){toastEl.style.opacity='0';},2300);
    }catch(e){}
  }
  function arm(){
    clearTimeout(exitTimer); exitTimer=null;
    try{
      if(mark()==='root'){history.pushState({__bk:'guard'},'');}
      else if(mark()!=='guard'){history.replaceState({__bk:'root'},''); history.pushState({__bk:'guard'},'');}
    }catch(e){}
  }
  /* Erst nach der ersten Berührung scharf schalten (Chrome überspringt sonst Einträge ohne Nutzeraktion) */
  function firstTouch(){
    document.removeEventListener('pointerdown',firstTouch,true);
    document.removeEventListener('keydown',firstTouch,true);
    arm();
    /* weitere Berührung nach dem „Beenden?“-Hinweis → wieder absichern */
    document.addEventListener('pointerdown',function(){ if(mark()==='root')arm(); },true);
  }
  document.addEventListener('pointerdown',firstTouch,true);
  document.addEventListener('keydown',firstTouch,true);

  window.addEventListener('popstate',function(){
    if(mark()!=='root')return; /* guard/Fremdeintrag: nichts tun */
    if(window.__portalBack()){ arm(); return; } /* App hat intern zurück navigiert */
    /* Startseite: Hinweis, 2. Druck beendet die App (root ist der erste Eintrag) */
    toast('Nochmal zurück drücken, um die App zu schließen');
    clearTimeout(exitTimer);
    exitTimer=setTimeout(arm,2500);
  });
})();
</script>
